
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f0f4f8;
        }

        .kalkulator {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .hasil {
            font-size: 2.5rem;
            font-weight: bold;
            color: #0d6efd;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="kalkulator">

            <h2 class="text-center mb-4">
                Kalkulator Sistem Bilangan
            </h2>

            <!-- Input Bilangan -->
            <div class="mb-3">
                <label for="bilangan" class="form-label">
                    Masukkan Bilangan
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="bilangan"
                    placeholder="Contoh: 1010"
                >
            </div>

            <!-- Select Sistem Bilangan Input -->
            <div class="mb-3">
                <label for="sistemInput" class="form-label">
                    Sistem Bilangan Input
                </label>

                <select class="form-select" id="sistemInput">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10" selected>Desimal (Basis 10)</option>
                    <option value="16">Heksadesimal (Basis 16)</option>
                </select>
            </div>

            <!-- Select Sistem Bilangan Hasil -->
            <div class="mb-3">
                <label for="sistemHasil" class="form-label">
                    Konversi Ke
                </label>

                <select class="form-select" id="sistemHasil">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10" selected>Desimal (Basis 10)</option>
                    <option value="16">Heksadesimal (Basis 16)</option>
                </select>
            </div>

            <!-- Tombol Konversi -->
            <button
                type="button"
                class="btn btn-primary w-100"
                onclick="konversikan()"
            >
                Konversi
            </button>

            <!-- Label Hasil -->
            <div class="mt-4 text-center">
                <label class="form-label">Hasil Konversi</label>
                <div id="hasil" class="hasil">-</div>
                <div id="pesan" class="text-danger mt-2"></div>
            </div>

        </div>
    </div>

    <script>
        function konversikan() {
            const bilangan = document
                .getElementById("bilangan")
                .value.trim();

            const basisInput = Number(
                document.getElementById("sistemInput").value
            );

            const basisHasil = Number(
                document.getElementById("sistemHasil").value
            );

            const labelHasil = document.getElementById("hasil");
            const pesan = document.getElementById("pesan");

            pesan.textContent = "";
            labelHasil.textContent = "-";

            // Memeriksa input kosong
            if (bilangan === "") {
                pesan.textContent = "Silakan masukkan bilangan!";
                return;
            }

            // Memvalidasi digit sesuai basis input
            const pola = {
                2: /^-?[01]+$/,
                8: /^-?[0-7]+$/,
                10: /^-?\d+$/,
                16: /^-?[0-9a-fA-F]+$/
            };

            if (!pola[basisInput].test(bilangan)) {
                pesan.textContent =
                    "Bilangan tidak valid untuk basis " +
                    basisInput + "!";
                return;
            }

            // Mengubah bilangan menjadi nilai desimal
            const nilai = Number.parseInt(bilangan, basisInput);

            if (!Number.isSafeInteger(nilai)) {
                pesan.textContent =
                    "Bilangan terlalu besar untuk dikonversi!";
                return;
            }

            // Mengonversi nilai ke basis tujuan
            const hasil = nilai.toString(basisHasil);

            // Heksadesimal menggunakan huruf kapital
            labelHasil.textContent =
                basisHasil === 16 ? hasil.toUpperCase() : hasil;
        }
    </script>

</body>
</html>
