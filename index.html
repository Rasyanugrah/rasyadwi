<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matematika Informatika - Rasya Dwi Anugrah</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #06110e;
      --card-bg: rgba(17, 34, 28, 0.88);
      --accent-green: #00ff87;
      --accent-gold: #ffd700;
      --text-main: #f0fdf4;
      --text-muted: #94a3b8;
      --border-color: #1f3b30;
      --error-color: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      /* Background Stadion Sepak Bola Malam Hari + Overlay Dark Gradient */
      background: linear-gradient(rgba(4, 18, 11, 0.85), rgba(6, 35, 22, 0.93)), 
                  url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Navbar */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(4, 18, 11, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--accent-green);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-brand {
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--accent-green);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
