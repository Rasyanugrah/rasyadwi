<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Sepak Bola & Bukti Belajar - Rasya Dwi Anugrah</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #06110e;
      --card-bg: #11221c;
      --accent-green: #00ff87;
      --accent-gold: #ffd700;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --border-color: #1f3b30;
      --error-color: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      /* Background dengan tema rumput stadion malam hari */
      background: linear-gradient(135deg, #04120b 0%, #062316 50%, #0f3d24 100%);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Navbar */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(4, 18, 11, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--accent-green);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-brand {
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--accent-green);
    }

    /* Main Layout */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Section Styling */
    section {
      margin-bottom: 4rem;
      scroll-margin-top: 5rem;
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--accent-green);
    }

    .section-subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }

    /* Hero & Biodata Section */
    .biodata-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--accent-green);
      border-radius: 1rem;
      padding: 2.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      box-shadow: 0 10px 30px rgba(0, 255, 135, 0.08);
    }

    .biodata-info h1 {
      font-size: 2.2rem;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
